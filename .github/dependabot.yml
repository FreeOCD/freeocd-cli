version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cargo
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github_actions
  # vendor/freeocd-web intentionally tracks release tags (currently v0.0.3),
  # not upstream HEAD — bump it manually when a new freeocd-web release lands.
