name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Lint - rustfmt + clippy (single x86_64 Linux runner)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install libudev-dev and pkg-config
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: rustfmt
        id: fmt
        run: cargo fmt --all --check

      - name: clippy
        id: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint summary
        if: always()
        shell: bash
        run: |
          status() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Lint Results"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| rustfmt | $(status ${{ steps.fmt.outcome }}) |"
            echo "| clippy | $(status ${{ steps.clippy.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Test - build + test across the supported OS/arch matrix
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Check names use the platform label so required status checks keep
        # working when runner images are bumped.
        include:
          - { platform: linux-x64, runner: ubuntu-26.04 }
          - { platform: linux-arm64, runner: ubuntu-26.04-arm }
          - { platform: macos-arm64, runner: macos-26 }
          - { platform: macos-x64, runner: macos-26-intel }
          - { platform: windows-x64, runner: windows-2025 }
          - { platform: windows-arm64, runner: windows-11-arm }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install libudev-dev and pkg-config
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Build
        id: build
        run: cargo build --locked --all-targets --verbose

      - name: Test
        id: test
        run: cargo test --locked --verbose

      - name: Test summary
        if: always()
        shell: bash
        run: |
          status() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Test Results (${{ matrix.platform }})"
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| build | $(status ${{ steps.build.outcome }}) |"
            echo "| test | $(status ${{ steps.test.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
