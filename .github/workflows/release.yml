name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run: build and package on PRs that touch the release inputs; only a
  # tag push reaches the publish job.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "LICENSE"
      - "README.md"
      - "src/dapjs/LICENSE"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Validate - the tag must match Cargo.toml, point into main history, and the
  # production environment must still require approval for v* tags.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate tag and release policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag matches Cargo.toml and main
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(sed -nE '/^\[package\]/,/^\[/{s/^version[[:blank:]]*=[[:blank:]]*"([^"]+)".*/\1/p}' Cargo.toml | head -n1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml package version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "label=v${version}-dryrun" >> "$GITHUB_OUTPUT"
            echo "Dry run for v${version}"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit in main history"
            exit 1
          fi
          echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify production requires approval and allows only v* tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/environments/production"
          gh api "$endpoint" | jq -e '
            .deployment_branch_policy.custom_branch_policies and
            any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))
          ' > /dev/null || { echo "::error::production must require a reviewer and use custom deployment policies"; exit 1; }
          gh api "$endpoint/deployment-branch-policies" | jq -e '
            any(.branch_policies[]; .name == "v*" and .type == "tag")
          ' > /dev/null || { echo "::error::production must allow the v* tag deployment policy"; exit 1; }

  # ---------------------------------------------------------------------------
  # Check - gate the release on fmt + clippy + tests before building artifacts
  # ---------------------------------------------------------------------------
  check:
    name: Check (fmt + clippy + test)
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Install libudev-dev and pkg-config
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Build - native per-target binaries packaged in each OS's standard archive
  # format (Linux: tar.gz, macOS/Windows: zip). All targets build natively to
  # avoid cross-compiling the hidapi/libudev C dependencies.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: [validate, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Release artifacts are built on the oldest supported runner images so
        # the binaries keep running there (glibc / macOS floor).
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libudev-dev and pkg-config
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Linux, tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_LABEL: ${{ needs.validate.outputs.label }}
        run: |
          stage="freeocd-${RELEASE_LABEL}-${{ matrix.target }}"
          mkdir -p "$stage/licenses"
          cp "target/${{ matrix.target }}/release/freeocd" "$stage/"
          cp LICENSE README.md "$stage/"
          cp src/dapjs/LICENSE "$stage/licenses/DAPjs-LICENSE.txt"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Package (macOS, zip)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_LABEL: ${{ needs.validate.outputs.label }}
        run: |
          stage="freeocd-${RELEASE_LABEL}-${{ matrix.target }}"
          mkdir -p "$stage/licenses"
          cp "target/${{ matrix.target }}/release/freeocd" "$stage/"
          cp LICENSE README.md "$stage/"
          cp src/dapjs/LICENSE "$stage/licenses/DAPjs-LICENSE.txt"
          zip -r -X -9 "${stage}.zip" "$stage"

      - name: Package (Windows, zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ needs.validate.outputs.label }}
        run: |
          $stage = "freeocd-$env:RELEASE_LABEL-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "$stage/licenses" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/freeocd.exe" -Destination $stage
          Copy-Item LICENSE, README.md -Destination $stage
          Copy-Item src/dapjs/LICENSE -Destination "$stage/licenses/DAPjs-LICENSE.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Smoke-test archive
        shell: bash
        env:
          RELEASE_LABEL: ${{ needs.validate.outputs.label }}
          TARGET: ${{ matrix.target }}
        run: |
          stage="freeocd-${RELEASE_LABEL}-${TARGET}"
          rm -rf smoke && mkdir smoke
          exe=freeocd
          case "$RUNNER_OS" in
            Linux) tar -xzf "${stage}.tar.gz" -C smoke ;;
            macOS) unzip -q "${stage}.zip" -d smoke ;;
            Windows)
              pwsh -NoProfile -Command "Expand-Archive -Path '${stage}.zip' -DestinationPath smoke"
              exe=freeocd.exe
              ;;
          esac
          dir="smoke/$stage"
          for f in "$exe" LICENSE README.md licenses/DAPjs-LICENSE.txt; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::$stage archive is missing $f"
              exit 1
            fi
          done
          version="${RELEASE_LABEL#v}"
          version="${version%-dryrun}"
          actual=$("$dir/$exe" --version)
          if [ "$actual" != "freeocd $version" ]; then
            echo "::error::$exe --version printed '$actual', expected 'freeocd $version'"
            exit 1
          fi
          "$dir/$exe" list | tee smoke/list.txt
          ids=$(grep -oE '"[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+"' vendor/freeocd-web/public/targets/index.json | tr -d '"')
          if [ -z "$ids" ]; then
            echo "::error::no target ids found in vendor/freeocd-web/public/targets/index.json"
            exit 1
          fi
          for id in $ids; do
            if ! awk -v id="$id" 'index($0, "  " id " — ") == 1 { found = 1 } END { exit !found }' smoke/list.txt; then
              echo "::error::$exe list does not show embedded target $id"
              exit 1
            fi
          done
          echo "✓ $stage: --version, list and bundled licenses OK"

      - name: Verify archive
        shell: bash
        run: |
          shopt -s nullglob
          produced=0
          for f in freeocd-*.tar.gz freeocd-*.zip; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 1024 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
            echo "✓ $f (${size} bytes)"
            produced=1
          done
          if [ "$produced" -ne 1 ]; then
            echo "::error::no release archive was produced"
            exit 1
          fi
          {
            echo "## Build (${{ matrix.target }})"
            for f in freeocd-*.tar.gz freeocd-*.zip; do
              echo "- \`$f\` ($(wc -c < "$f") bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freeocd-${{ matrix.target }}
          path: |
            freeocd-*.tar.gz
            freeocd-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish - aggregate checksums and create the GitHub Release
  # (least-privilege: contents:write only here).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          digest-mismatch: error

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum freeocd-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: List release files
        run: ls -la dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/freeocd-*.tar.gz
            dist/freeocd-*.zip

      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        # zizmor: ignore[superfluous-actions] keeps gh-release for generated notes + file upload UX
        with:
          generate_release_notes: true
          files: |
            dist/freeocd-*.tar.gz
            dist/freeocd-*.zip
            dist/checksums-sha256.txt

      - name: Release summary
        if: ${{ !cancelled() }}
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github-release.outcome }}
        run: |
          {
            echo "## Release ${RELEASE_NAME}"
            echo ""
            echo "GitHub Release: ${GITHUB_RELEASE_OUTCOME:-skipped}"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat dist/checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
